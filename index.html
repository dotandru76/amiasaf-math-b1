<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תרגול ח ב1">
<meta name="format-detection" content="telephone=no">
<title>תרגול יומי – ח' ב1</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1f2a37; --muted:#6b7280;
  --brand:#2f6fdf; --brand2:#1e4fb0; --ok:#16a34a; --okbg:#e8f7ee;
  --warn:#d97706; --warnbg:#fff4e0; --bad:#dc2626; --badbg:#fdecec; --line:#e5e1d8;
  --t1:#e0edff; --t2:#ffe9d6; --t3:#e3f6ea; --t4:#efe6ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Rubik',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600;white-space:nowrap}
h1,h2,h3{margin:0}
.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.top .school{font-size:13px;opacity:.85}
.top h1{font-size:23px;font-weight:800;margin-top:2px}
.top .sub{margin-top:6px;font-size:15px;opacity:.95}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:800}
.stat span{font-size:12px;opacity:.9}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;background:var(--brand);color:#fff;text-align:center}
.btn:active{transform:scale(.98)}
.mission,.choice,.btn,.pm{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-appearance:none;appearance:none}
.btn.ok{background:var(--ok)}
.weekhead{font-weight:700;color:var(--muted);font-size:14px;margin:16px 4px 8px}
.mission{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px;margin-bottom:9px;border:2px solid transparent;cursor:pointer}
.mission .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.mission .info{flex:1;min-width:0}
.mission .t{font-weight:700;font-size:16px}
.mission .d{font-size:13px;color:var(--muted)}
.mission .st{font-size:13px;flex:none;text-align:center;min-width:60px;font-weight:700}
.mission.locked{opacity:.5;cursor:default}
.mission.today{border-color:var(--brand)}
.mission.late{border-color:var(--warn)}
.mission.done .st{color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-inline-start:6px;vertical-align:middle}
.tag.today{background:var(--brand);color:#fff}
.tag.late{background:var(--warnbg);color:var(--warn)}
.back{background:none;border:0;font:inherit;color:var(--brand);font-weight:700;padding:4px 0;margin-bottom:6px;cursor:pointer}
.mhead{border-radius:16px;padding:14px 16px;margin-bottom:12px}
.mhead .k{font-size:13px;font-weight:700;opacity:.75}
.mhead h2{font-size:21px;font-weight:800}
.learn h3{font-size:17px;margin-bottom:6px}
.learn p{margin:0 0 8px}
.steps{background:#f2f7ff;border-radius:12px;padding:10px 12px;margin-top:6px}
.steps .h{font-weight:700;margin-bottom:4px}
.steps ol{margin:0;padding-inline-start:20px}
.steps li{margin:3px 0}
details.tool{background:#fffbea;border:2px dashed #f0d264;border-radius:14px;padding:10px 14px;margin-bottom:12px}
details.tool summary{font-weight:700;cursor:pointer}
details.tool ul{margin:6px 0 0;padding-inline-start:20px}
details.tool li{margin:3px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 12px}
.dot{width:34px;height:8px;border-radius:5px;background:#ddd6c8}
.dot.on{background:var(--brand)}
.dot.fin{background:var(--ok)}
.qk{font-size:13px;font-weight:700;color:var(--muted)}
.qtitle{font-size:18px;font-weight:700;margin:2px 0 10px}
.prompt{margin-bottom:10px}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;padding:10px;background:#faf8f3;border-radius:12px}
.field .lab{flex:1 1 100%;font-weight:500}
.field .inwrap{display:flex;align-items:center;gap:6px;direction:ltr}
.field input{width:110px;font:inherit;font-size:22px;font-weight:700;text-align:center;padding:8px;border:2px solid var(--line);border-radius:12px;direction:ltr;background:#fff}
.field input.good{border-color:var(--ok);background:var(--okbg)}
.field input.wrong{border-color:var(--bad);background:var(--badbg)}
.pm{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.suf{font-size:20px;font-weight:700}
.pt{display:flex;align-items:center;gap:4px;direction:ltr;font-size:22px;font-weight:700}
.pt input{width:72px}
.choices{display:flex;flex-direction:column;gap:7px;width:100%}
.choice{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font:inherit;text-align:right;cursor:pointer}
.choice.sel{border-color:var(--brand);background:#eaf1ff}
.choice.good{border-color:var(--ok);background:var(--okbg)}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.choices.inline{flex-direction:row;flex-wrap:wrap}
.choices.inline .choice{flex:1;text-align:center;min-width:80px}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:500;display:none}
.fb.ok{display:block;background:var(--okbg);color:#11643a}
.fb.hint{display:block;background:var(--warnbg);color:#7a4a00}
.fb.sol{display:block;background:#eef2f8;color:var(--ink)}
table.dt{border-collapse:collapse;margin:8px auto;direction:rtl;font-size:16px}
table.dt td,table.dt th{border:1.5px solid #cfc8b8;padding:6px 10px;text-align:center}
table.dt th{background:#f3efe6;font-weight:700}
.svgbox{text-align:center;margin:6px 0}
.fin{text-align:center}
.fin .big{font-size:24px;font-weight:800;color:var(--ok);margin:6px 0}
.parent{background:var(--t3);border-radius:12px;padding:12px;margin:12px 0;font-size:16px}
.small{font-size:13px;color:var(--muted)}
@media (min-width:768px){ .wrap{max-width:720px;padding:24px 24px 60px} body{font-size:19px} .qtitle{font-size:20px} .field input{width:130px} .pt input{width:84px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const T_OPEN="#dd-morah-b1", T_ALL="#dd-tshuvot-b1";
const TEACHER_MODE = [T_OPEN,T_ALL].includes(location.hash||"");
const STORE_KEY = TEACHER_MODE ? "amiasaf_b1_daily_teacher" : "amiasaf_b1_daily_v2";

const M = s => `<span class="m">${s}</span>`;
function grid(points){
  const min=-6,max=6,c=20,pad=14,size=(max-min)*c+pad*2;
  const X=x=>pad+(x-min)*c, Y=y=>pad+(max-y)*c;
  let g=`<svg viewBox="0 0 ${size} ${size}" width="250" height="250" xmlns="http://www.w3.org/2000/svg" style="direction:ltr">`;
  for(let i=min;i<=max;i++){
    g+=`<line x1="${X(i)}" y1="${Y(min)}" x2="${X(i)}" y2="${Y(max)}" stroke="#e3ded2"/>`;
    g+=`<line x1="${X(min)}" y1="${Y(i)}" x2="${X(max)}" y2="${Y(i)}" stroke="#e3ded2"/>`;
  }
  g+=`<line x1="${X(min)}" y1="${Y(0)}" x2="${X(max)}" y2="${Y(0)}" stroke="#555" stroke-width="2"/>`;
  g+=`<line x1="${X(0)}" y1="${Y(min)}" x2="${X(0)}" y2="${Y(max)}" stroke="#555" stroke-width="2"/>`;
  g+=`<text x="${X(max)-4}" y="${Y(0)-5}" font-size="12" text-anchor="end">x</text><text x="${X(0)+6}" y="${Y(max)+11}" font-size="12">y</text>`;
  for(let i=min+1;i<max;i++){ if(i===0||i%2) continue;
    g+=`<text x="${X(i)}" y="${Y(0)+14}" font-size="10" text-anchor="middle" fill="#888">${i}</text>`;
    g+=`<text x="${X(0)-5}" y="${Y(i)+4}" font-size="10" text-anchor="end" fill="#888">${i}</text>`; }
  points.forEach(p=>{ g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${p.color||'#e11d48'}"/><text x="${X(p.x)+8}" y="${Y(p.y)-7}" font-size="14" font-weight="700" fill="${p.color||'#e11d48'}">${p.label}</text>`; });
  return g+`</svg>`;
}
function cylinderSVG(){
  return `<svg viewBox="0 0 160 140" width="150" height="130" xmlns="http://www.w3.org/2000/svg" style="direction:ltr">
  <ellipse cx="80" cy="25" rx="55" ry="16" fill="#dbeafe" stroke="#1e4fb0" stroke-width="2"/>
  <line x1="25" y1="25" x2="25" y2="113" stroke="#1e4fb0" stroke-width="2"/><line x1="135" y1="25" x2="135" y2="113" stroke="#1e4fb0" stroke-width="2"/>
  <path d="M25 113 A55 16 0 0 0 135 113" fill="none" stroke="#1e4fb0" stroke-width="2"/><path d="M25 113 A55 16 0 0 1 135 113" fill="none" stroke="#1e4fb0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="80" y1="25" x2="135" y2="25" stroke="#e11d48" stroke-width="2"/><text x="100" y="20" font-size="13" fill="#e11d48" font-weight="700">R</text>
  <text x="141" y="73" font-size="13" fill="#16a34a" font-weight="700">h</text></svg>`;
}
function coneSVG(){
  return `<svg viewBox="0 0 160 140" width="150" height="130" xmlns="http://www.w3.org/2000/svg" style="direction:ltr">
  <line x1="80" y1="8" x2="25" y2="113" stroke="#9a3412" stroke-width="2"/><line x1="80" y1="8" x2="135" y2="113" stroke="#9a3412" stroke-width="2"/>
  <path d="M25 113 A55 16 0 0 0 135 113" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><path d="M25 113 A55 16 0 0 1 135 113" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="80" y1="8" x2="80" y2="113" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="85" y="68" font-size="13" fill="#16a34a" font-weight="700">h</text>
  <line x1="80" y1="113" x2="135" y2="113" stroke="#e11d48" stroke-width="2"/><text x="102" y="108" font-size="13" fill="#e11d48" font-weight="700">R</text></svg>`;
}
function pctTable(t1,p1,t2,p2){
  const c=v=>/x/.test(v)?`<td style="color:#e11d48;font-weight:800">${v}</td>`:`<td><b>${v}</b></td>`;
  return `<table class="dt"><tr><th></th><th>כמות</th><th>אחוז (%)</th></tr><tr><th>חלק</th>${c(t1)}${c(p1)}</tr><tr><th>שלם</th>${c(t2)}${c(p2)}</tr></table>`;
}
const gradesTable = `<table class="dt"><tr><th>ציון</th><td>60</td><td>70</td><td>80</td><td>90</td><td>100</td></tr><tr><th>מספר תלמידים</th><td>2</td><td>3</td><td>8</td><td>5</td><td>2</td></tr></table>`;
const kidsTable = `<table class="dt"><tr><th>מספר ילדים במשפחה</th><td>1</td><td>2</td><td>3</td></tr><tr><th>מספר משפחות</th><td>2</td><td>6</td><td>2</td></tr></table>`;
const exTable = `<table class="dt"><tr><th>ציון</th><td>6</td><td>7</td><td>8</td></tr><tr><th>מספר תלמידים</th><td>1</td><td>4</td><td>5</td></tr></table>`;

const TOPICS = {
  pct:{name:"אחוזים",icon:"%",bg:"var(--t1)"},
  stat:{name:"סטטיסטיקה",icon:"📊",bg:"var(--t2)"},
  geo:{name:"גליל וחרוט",icon:"🥫",bg:"var(--t3)"},
  eq:{name:"משוואות",icon:"=",bg:"var(--t4)"},
  mix:{name:"חזרה",icon:"✎",bg:"#fff1c2"}
};

/* learn: הסבר קצר + דוגמה פתורה בשלבים */
const MISSIONS = [
{ id:1, date:"2026-11-08", topic:"eq", title:"משוואות – כמו מאזניים",
  learn:{ p:[`משוואה היא כמו <b>מאזניים</b>: כל פעולה שעושים בצד אחד – חובה לעשות גם בצד השני.`,
             `את הפעולה רושמים בצד, אחרי לוכסן, למשל ${M("/ −2x")}.`,
             `סדר העבודה: 1) מעבירים את כל ה-x לצד אחד. 2) מעבירים את המספרים לצד השני. 3) מחלקים במספר שליד x.`,
             `בסוף אפשר לבדוק: מציבים את התשובה במשוואה ובודקים ששני הצדדים שווים.`],
          ex:`דוגמה: ${M("4x − 11 = 2x + 5")}`,
          steps:[`${M("/ −2x")} ← ${M("2x − 11 = 5")}`,`${M("/ +11")} ← ${M("2x = 16")}`,`${M("/ :2")} ← ${M("x = 8")}`,`בדיקה: ${M("4·8 − 11 = 21")} , ${M("2·8 + 5 = 21")} ✓`] },
  tool:["כל פעולה – בשני הצדדים",`x לצד אחד, מספרים לצד שני`,"בסוף מחלקים במספר שליד x"],
  qs:[
   {title:"משוואה בשני צעדים", prompt:`${M("3x + 4 = 19")}`,
    fields:[{label:`${M("/ −4")} ← ${M("3x =")}`,ans:15},{label:`${M("/ :3")} ← ${M("x =")}`,ans:5}],
    hint:`${M("19 − 4 = 15")}. אחר כך ${M("15 : 3")}.`, sol:`${M("3x = 15")} ← ${M("x = 5")}`},
   {title:"x בשני הצדדים", prompt:`${M("4x + 12 = 60 − 8x")}`,
    fields:[{label:`${M("/ +8x")} ואחר כך ${M("/ −12")} ← ${M("12x =")}`,ans:48},{label:`${M("/ :12")} ← ${M("x =")}`,ans:4}],
    hint:`${M("4x + 8x = 12x")} , ${M("60 − 12 = 48")}`, sol:`${M("12x = 48")} ← ${M("x = 4")}`},
   {title:"כינוס ותשובה שלילית", prompt:`${M("−2x − 2 + 8 = 12")}`,
    fields:[{label:`כינוס: ${M("−2x + 6 = 12")} ← ${M("/ −6")} ← ${M("−2x =")}`,ans:6,neg:true},{label:`${M("/ :(−2)")} ← ${M("x =")}`,ans:-3,neg:true}],
    hint:`${M("12 − 6 = 6")}. מחלקים ב-(−2): פלוס חלקי מינוס = מינוס.`, sol:`${M("−2x = 6")} ← ${M("x = −3")}`}
  ]},
{ id:2, date:"2026-11-09", topic:"eq", title:"משוואות עם סוגריים",
  learn:{ p:[`<b>פתיחת סוגריים (חוק הפילוג):</b> כופלים את המספר שבחוץ <b>בכל אחד</b> מהאיברים שבתוך הסוגריים. ${M("3(x + 2) = 3x + 6")}`,
             `<b>זהירות – כופל שלילי מחליף סימנים:</b> ${M("−2(x + 3) = −2x − 6")}. וגם מינוס לפני סוגריים: ${M("−(x + 1) = −x − 1")}.`,
             `אחרי פתיחת הסוגריים – מכנסים איברים דומים, ופותרים כמו משוואה רגילה.`],
          ex:`דוגמה: ${M("4(x − 1) = 20 − 2(x + 3)")}`,
          steps:[`פתיחת סוגריים: ${M("4x − 4 = 20 − 2x − 6")}`,`כינוס: ${M("4x − 4 = 14 − 2x")}`,`${M("/ +2x")} ← ${M("6x − 4 = 14")}`,`${M("/ +4")} ← ${M("6x = 18")} ← ${M("/ :6")} ← ${M("x = 3")}`] },
  tool:["כופלים את המספר שבחוץ בכל איבר בסוגריים","כופל שלילי מחליף את הסימנים בפנים","אחרי הפתיחה: כינוס ← פותרים"],
  qs:[
   {title:"פתיחת סוגריים", fields:[
     {type:"choice",inline:true,label:`${M("3(x + 2) =")}`,options:["3x + 2","3x + 6","x + 6"],ans:1},
     {type:"choice",inline:true,label:`${M("−2(x + 3) =")}`,options:["−2x + 6","−2x − 6","−2x + 3"],ans:1}],
    hint:"כופלים את המספר שבחוץ בכל אחד מהאיברים. כופל שלילי ← הפלוס בפנים הופך למינוס.", sol:`${M("3x + 6")} ; ${M("−2x − 6")}`},
   {title:"מינוס לפני סוגריים", prompt:`${M("4x − (x + 1) = 17")}`,
    fields:[{label:`פותחים ומכנסים: ${M("3x − 1 = 17")} ← ${M("/ +1")} ← ${M("3x =")}`,ans:18},{label:`${M("/ :3")} ← ${M("x =")}`,ans:6}],
    hint:`${M("−(x + 1) = −x − 1")}. ${M("17 + 1 = 18")}.`, sol:`${M("3x = 18")} ← ${M("x = 6")}`},
   {title:"היקף מלבן", prompt:`היקף מלבן הוא 68 ס"מ. הרוחב ${M("x")} והאורך ${M("3x + 2")}.<br>המשוואה: ${M("2x + 2(3x + 2) = 68")}`,
    fields:[{label:`${M("x =")}`,ans:8,suf:"ס\"מ"},{label:"אורך המלבן =",ans:26,suf:"ס\"מ"}],
    hint:`${M("2x + 6x + 4 = 68")} ← ${M("8x = 64")}. האורך: מציבים ב-${M("3x + 2")}.`, sol:`${M("x = 8")} ; ${M("3·8 + 2 = 26")}`}
  ]},
{ id:3, date:"2026-11-10", topic:"pct", title:"שיטת הטבלה: מציאת החלק",
  learn:{ p:[`<b>אחוז</b> פירושו "מתוך 100". אחוזים שכדאי לזכור: 100% = השלם, 50% = חצי, 25% = רבע, 10% = עשירית.`,
             `לכל שאלת אחוזים משרטטים את אותה טבלה: <b>החלק למעלה, השלם למטה</b>. <b>הכמות בימין, האחוז בשמאל</b>. מול השלם תמיד כותבים <b>100%</b>.`,
             `פותרים ב<b>כפל בהצלבה</b>: כופלים את שני המספרים שבאלכסון המלא, ומשווים למספר שבאלכסון של x.`],
          ex:"דוגמה: בכיתה 30 תלמידים. 20% מהם מרכיבים משקפיים. כמה תלמידים מרכיבים משקפיים?",
          exHtml:pctTable("x","20%","30","100%"),
          steps:[`כפל בהצלבה: ${M("100 · x = 30 · 20")}`,`${M("100x = 600")}`,`${M("x = 6")} ← 6 תלמידים.`,`בדיקה: 10% מ-30 זה 3, אז 20% זה 6. ✓`] },
  tool:["חלק למעלה, שלם למטה","כמות בימין, אחוז בשמאל","100% תמיד מול השלם","כפל בהצלבה ← מחלקים במספר שליד x"],
  qs:[
   {title:"איפה יושב כל מספר?", prompt:`השאלה: "כמה הם 40% מתוך 50?"`,
    fields:[{type:"choice",inline:true,label:"איזה מספר יושב למטה, מול 100%?",options:["40","50","100"],ans:1},
            {type:"choice",inline:true,label:"איפה יושב x?",options:["למעלה, מול 40%","למטה, מול 100%"],ans:0}],
    hint:"מול 100% יושב תמיד השלם (הסך הכול). x הוא החלק שמחפשים – למעלה.", sol:"למטה: 50 מול 100%. למעלה: x מול 40%."},
   {title:"20% מ-50 שקלים", prompt:`כמה הם 20% מתוך 50 שקלים?${pctTable("x","20%","50","100%")}`,

    hint:`שכיח: איזה מספר מופיע הכי הרבה? ממוצע: ${M("5+7+7+9+7 = 35")} ואז : 5.`, sol:`שכיח 7 ; ${M("35 : 5 = 7")}`},
   {title:"גליל וחרוט", prompt:`גליל: ${M("R = 3")}, ${M("h = 4")}.`,
    fields:[{label:"נפח הגליל =",ans:36,suf:"π"},{label:"נפח חרוט עם אותו בסיס ואותו גובה =",ans:12,suf:"π"}],
    hint:`${M("3 × 3 = 9")} , ${M("9 × 4 = 36")}. חרוט: 36 : 3.`, sol:`${M("36π")} ; ${M("12π")}`},
   {title:"משוואות", prompt:`${M("5(x − 2) = 15")}`,
    fields:[{label:`פתיחת סוגריים: ${M("5x − 10 = 15")} ← ${M("x =")}`,ans:5,neg:true}],
    hint:`${M("/ +10")} ← ${M("5x = 25")} ← ${M("/ :5")}`, sol:`${M("5x = 25")} ← ${M("x = 5")}`}
  ]}
];

/* ============ מצב ============ */
let state = {done:{}};
function load(){ try{ const s=localStorage.getItem(STORE_KEY); if(s) state=Object.assign(state,JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isOpen(m){ return TEACHER_MODE || todayStr() >= m.date; }
const HEB_DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function fmtDate(s){ const [y,mo,da]=s.split("-").map(Number); const d=new Date(y,mo-1,da,12); return `יום ${HEB_DAYS[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}`; }
const $ = id => document.getElementById(id);

/* ============ מסך בית ============ */
function renderHome(){
  const doneCount=Object.keys(state.done).length;
  let html = `<div class="top"><div class="school">חט"ב עמי אסף • מתמטיקה ח' ב1</div><h1>תרגול יומי</h1>
  <div class="sub">כל יום: הסבר קצר ו-3 תרגילים.</div>
  <div class="stats"><div class="stat"><b>${doneCount}/${MISSIONS.length}</b><span>משימות בוצעו</span></div></div></div>`;
  const weeks=[["שבוע 1 – משוואות ואחוזים",[1,2,3,4,5]],["שבוע 2 – סטטיסטיקה, גליל וחרוט",[6,7,8,9,10]],["סיכום",[11]]];
  const t=todayStr();
  weeks.forEach(([wt,ids])=>{
    html+=`<div class="weekhead">${wt}</div>`;
    ids.forEach(id=>{
      const m=MISSIONS.find(x=>x.id===id), tp=TOPICS[m.topic], d=state.done[id], open=isOpen(m);
      let cls="mission", tag="", st="";
      if(d){ cls+=" done"; st=`✓ בוצע`; }
      else if(!open){ cls+=" locked"; st="🔒"; }
      else if(m.date===t){ cls+=" today"; tag=`<span class="tag today">היום</span>`; st="פתיחה"; }
      else if(m.date>t){ st="פתיחה"; }
      else { cls+=" late"; tag=`<span class="tag late">להשלים</span>`; st="פתיחה"; }
      html+=`<div class="${cls}" data-id="${id}"><div class="ic" style="background:${tp.bg}">${tp.icon}</div>
      <div class="info"><div class="t">משימה ${id}: ${m.title}${tag}</div><div class="d">${fmtDate(m.date)} • ${tp.name}</div></div><div class="st">${st}</div></div>`;
    });
  });
  html+=`<div class="small" style="text-align:center;margin-top:14px">משימה נפתחת ביום שלה. משימה שפוספסה אפשר להשלים בכל זמן.</div>`;
  if(TEACHER_MODE) html+=`<div style="height:10px"></div><a class="btn" href="${T_ALL}" style="text-decoration:none">כל התרגילים והתשובות</a><div style="height:8px"></div><button class="btn" id="rst" style="background:#eef2f8;color:var(--ink)">איפוס ההתקדמות של המורה</button>`;
  if(TEACHER_MODE) html=`<div style="background:#1f2a37;color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px;font-weight:700">🔑 מצב מורה – כל המשימות פתוחות. ההתקדמות כאן נפרדת מזו של התלמיד.</div>`+html;
  $("app").innerHTML=html;
  if($("rst")) $("rst").onclick=()=>{ state.done={}; save(); renderHome(); };
  document.querySelectorAll(".mission").forEach(el=>{
    el.onclick=()=>{ const m=MISSIONS.find(x=>x.id==el.dataset.id); if(!isOpen(m) && !state.done[m.id]) return; startMission(m); };
  });
  window.scrollTo(0,0);
}

/* ============ משימה ============ */
let run=null;
function headHTML(m){ const tp=TOPICS[m.topic];
  return `<button class="back" id="bk">→ חזרה לרשימה</button>
  <div class="mhead" style="background:${tp.bg}"><div class="k">משימה ${m.id} • ${fmtDate(m.date)} • ${tp.name}</div><h2>${m.title}</h2></div>`; }
function startMission(m){
  run={m, i:-1};
  const L=m.learn;
  $("app").innerHTML = headHTML(m) + `<div class="card learn"><h3>📘 הסבר</h3>${L.p.map(x=>`<p>${x}</p>`).join("")}
    ${L.steps.length?`<div class="steps"><div class="h">${L.ex}</div>${L.exHtml||""}<ol>${L.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`:""}</div>
    ${m.data?`<div class="card">${m.data}</div>`:""}
    <button class="btn" id="go">לתרגילים (${m.qs.length}) ←</button>`;
  $("bk").onclick=renderHome; $("go").onclick=()=>{ run.i=0; renderQuestion(); };
  window.scrollTo(0,0);
}
function renderQuestion(){
  const {m,i}=run, q=m.qs[i];
  run.tries=0; run.solved=false; run.choiceSel={};
  let html = headHTML(m) + `<details class="tool"><summary>🧰 ארגז כלים</summary><ul>${m.tool.map(t=>`<li>${t}</li>`).join("")}</ul></details>
  <div class="dots">${m.qs.map((_,k)=>`<div class="dot ${k<i?'fin':(k===i?'on':'')}"></div>`).join("")}</div>
  <div class="card"><div class="qk">תרגיל ${i+1} מתוך ${m.qs.length}</div><div class="qtitle">${q.title}</div>
  ${m.data?`<div class="prompt">${m.data}</div>`:""}
  ${q.prompt?`<div class="prompt">${q.prompt}</div>`:""}
  ${q.fields.map((f,k)=>fieldHTML(f,k)).join("")}
  <div class="fb" id="fb"></div>
  <div id="acts"><button class="btn" id="chk">בדיקה</button></div></div>`;
  $("app").innerHTML=html; window.scrollTo(0,0);
  $("bk").onclick=()=>{ run=null; renderHome(); };
  $("chk").onclick=check;
  document.querySelectorAll(".pm").forEach(b=>b.onclick=()=>{ const inp=$(b.dataset.for); const v=inp.value.trim(); inp.value = /^[−-]/.test(v) ? v.slice(1) : "-"+v; inp.focus(); });
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(run.solved) return;
    const k=b.dataset.k; document.querySelectorAll(`.choice[data-k="${k}"]`).forEach(x=>x.classList.remove("sel","wrong","good"));
    b.classList.add("sel"); run.choiceSel[k]=+b.dataset.o;
  });
  document.querySelectorAll(".field input").forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); }));
}
function fieldHTML(f,k){
  if(f.type==="choice") return `<div class="field"><div class="lab">${f.label}</div><div class="choices ${f.inline?'inline':''}">${f.options.map((o,j)=>`<button class="choice" data-k="${k}" data-o="${j}">${o}</button>`).join("")}</div></div>`;
  if(f.type==="point") return `<div class="field"><div class="lab">${f.label}</div>
    <div class="pt">( <input id="f${k}x" inputmode="decimal" autocomplete="off" placeholder="x"><button class="pm" data-for="f${k}x" type="button">±</button> ,
    <input id="f${k}y" inputmode="decimal" autocomplete="off" placeholder="y"><button class="pm" data-for="f${k}y" type="button">±</button> )</div></div>`;
  return `<div class="field"><div class="lab">${f.label}</div><div class="inwrap"><input id="f${k}" inputmode="decimal" autocomplete="off">${f.neg?`<button class="pm" data-for="f${k}" type="button">±</button>`:""}${f.suf?`<span class="suf">${f.suf}</span>`:""}</div></div>`;
}
function num(v){ v=String(v).trim().replace(/[−–]/g,"-").replace(/,/g,".").replace(/[%π₪\s]/g,""); if(v===""||v==="-") return NaN; return Number(v); }
const eq=(a,b)=>Math.abs(a-b)<1e-6;
function check(){
  if(run.solved) return;
  const q=run.m.qs[run.i]; let allOk=true, anyEmpty=false;
  q.fields.forEach((f,k)=>{
    if(f.type==="choice"){
      const s=run.choiceSel[k], btns=document.querySelectorAll(`.choice[data-k="${k}"]`);
      if(s===undefined){ anyEmpty=true; allOk=false; return; }
      btns.forEach(b=>b.classList.remove("good","wrong"));
      if(s===f.ans) btns[s].classList.add("good"); else { btns[s].classList.add("wrong"); allOk=false; }
    } else if(f.type==="point"){
      ["x","y"].forEach((c,ci)=>{ const inp=$(`f${k}${c}`), v=num(inp.value); inp.classList.remove("good","wrong");
        if(isNaN(v)){ anyEmpty=true; allOk=false; return; }
        if(eq(v,f.ans[ci])) inp.classList.add("good"); else { inp.classList.add("wrong"); allOk=false; } });
    } else {
      const inp=$(`f${k}`), v=num(inp.value); inp.classList.remove("good","wrong");
      if(isNaN(v)){ anyEmpty=true; allOk=false; return; }
      if(eq(v,f.ans)) inp.classList.add("good"); else { inp.classList.add("wrong"); allOk=false; }
    }
  });
  const fb=$("fb");
  if(anyEmpty && !document.querySelector(".wrong")){ fb.className="fb hint"; fb.innerHTML="חסרה תשובה – מלאו את כל המשבצות."; return; }
  if(allOk){
    run.solved=true; fb.className="fb ok"; fb.innerHTML="✓ נכון";
    $("acts").innerHTML=`<button class="btn ok" id="nx">${run.i<run.m.qs.length-1?"לתרגיל הבא ←":"סיום המשימה"}</button>`;
    $("nx").onclick=next; return;
  }
  run.tries++;
  if(run.tries<3){ fb.className="fb hint"; fb.innerHTML=`לא נכון. רמז: ${q.hint}<br><span class="small">תקנו את המשבצות האדומות ובדקו שוב.</span>`; }
  else { fb.className="fb sol"; fb.innerHTML=`פתרון: <b>${q.sol}</b><br><span class="small">כתבו את התשובה הנכונה ולחצו "בדיקה" כדי להמשיך.</span>`; }
}
function next(){ run.i++; if(run.i<run.m.qs.length) renderQuestion(); else finishMission(); }

function finishMission(){
  const m=run.m, now=new Date();
  const when=`${now.getDate()}.${now.getMonth()+1} בשעה ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  if(!state.done[m.id]) { state.done[m.id]={when}; save(); }
  run=null;
  const rec=state.done[m.id];
  $("app").innerHTML = headHTML(m) + `<div class="card fin">
    <div class="big">✓ משימה ${m.id} בוצעה</div>
    <div>${m.title}</div>
    <div class="parent">להורה: המשימה של ${fmtDate(m.date)} הושלמה ב-${rec.when}.<br>לסמן ✓ ולחתום בדף המעקב.</div>
    <button class="btn" id="hm">חזרה לרשימה</button></div>`;
  $("bk").onclick=renderHome; $("hm").onclick=renderHome; window.scrollTo(0,0);
}


/* ============ תצוגת מורה: כל התרגילים והתשובות ============ */
function ansText(f){
  if(f.type==="choice") return f.options[f.ans];
  if(f.type==="point") return M(`(${f.ans[0]}, ${f.ans[1]})`.replace(/-/g,"−"));
  return M(String(f.ans).replace(/-/g,"−") + (f.suf==="π"?"π":"")) + (f.suf && f.suf!=="π" ? " "+f.suf : "");
}
function renderAll(){
  let h=`<div class="top"><div class="school">חט"ב עמי אסף • מתמטיקה ח' ב1</div><h1>כל המשימות – תצוגת מורה</h1><div class="sub">הסבר, דוגמה, תרגילים ותשובות</div></div>
  <button class="btn" id="hm" style="margin-bottom:12px">לתצוגת התלמיד</button>`;
  MISSIONS.forEach(m=>{ const tp=TOPICS[m.topic], L=m.learn;
    h+=`<div class="mhead" style="background:${tp.bg}"><div class="k">משימה ${m.id} • ${fmtDate(m.date)} • ${tp.name}</div><h2>${m.title}</h2></div>
    <div class="card learn"><h3>📘 הסבר</h3>${L.p.map(x=>`<p>${x}</p>`).join("")}
    ${L.steps.length?`<div class="steps"><div class="h">${L.ex}</div>${L.exHtml||""}<ol>${L.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>`:""}</div>
    ${m.data?`<div class="card">${m.data}</div>`:""}`;
    m.qs.forEach((q,i)=>{
      h+=`<div class="card"><div class="qk">תרגיל ${i+1}</div><div class="qtitle">${q.title}</div>${q.prompt?`<div class="prompt">${q.prompt}</div>`:""}
      <ul style="margin:0;padding-inline-start:20px">${q.fields.map(f=>`<li style="margin:6px 0">${f.label}${f.type==="choice"?` <span class="small">(${f.options.join(" / ")})</span>`:""}<br><b style="color:var(--ok)">תשובה: ${ansText(f)}</b></li>`).join("")}</ul>
      <div class="small" style="margin-top:6px">רמז: ${q.hint}</div></div>`;
    });
  });
  $("app").innerHTML=h; $("hm").onclick=()=>{ location.hash=T_OPEN; };
  window.scrollTo(0,0);
}

load(); if(location.hash===T_ALL) renderAll(); else renderHome();
window.addEventListener("hashchange",()=>location.reload());
</script>
</body>
